name: minecraft

volumes:
  minecraft-install:     # Paper server jar (~50 MB, shared between init and server)
  minecraft-serverdata:  # World data, server.properties, plugins, logs

services:
  # ── Init: resolves the latest Paper build and downloads it, then exits ─────
  minecraft-init:
    image: minecraftdedicatedserverarm
    build: .
    container_name: minecraft-init
    environment:
      MINECRAFT_MODE: init
      MINECRAFT_VERSION: ""     # e.g. "1.21.1", empty/"latest" resolves the newest Minecraft version
      MINECRAFT_GEYSER: "true"  # downloads latest Geyser-Spigot + floodgate-spigot into /serverdata/plugins
    volumes:
      - minecraft-install:/home/admin/app/paper
      - minecraft-serverdata:/serverdata
    restart: "no"

  # ── Server ───────────────────────────────────────────────────────────────────
  minecraft:
    image: minecraftdedicatedserverarm
    container_name: minecraft
    depends_on:
      minecraft-init:
        condition: service_completed_successfully
    ports:
      - "25565:25565/tcp"
      - "19132:19132/udp"  # Geyser (Bedrock/RakNet) listener
    environment:
      MINECRAFT_EULA: "true"        # required: https://aka.ms/MinecraftEULA
      MINECRAFT_JAVA_ARGS: ""       # e.g. "-Xms2G -Xmx4G"
      MINECRAFT_ARGS: ""            # e.g. extra paper.jar arguments
    volumes:
      - minecraft-install:/home/admin/app/paper
      - minecraft-serverdata:/serverdata
    restart: unless-stopped
